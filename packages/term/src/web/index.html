<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graveyard BBS</title>
    <link rel="stylesheet" href="xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #b8b8b8;
        font: 14px monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #runs {
        padding: 4px 8px;
      }
      #runs:empty {
        display: none;
      }
      #runs a {
        color: #ff8700;
        margin-right: 12px;
      }
      /* The terminal fills what is left of the page; below 80x24 it scrolls instead. */
      #term {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body data-mode="__MODE__">
    <nav id="runs" aria-label="Recorded runs"></nav>
    <div id="term" role="application" aria-label="Graveyard BBS terminal"></div>
    <noscript
      >Graveyard BBS needs JavaScript. Telnet works too: telnet 127.0.0.1
      2323</noscript
    >
    <script src="client.js"></script>
  </body>
</html>
