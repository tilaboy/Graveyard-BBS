<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social card (1200 x 630): banner, tagline, the needs-you row. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0614"/>
      <stop offset="0.6" stop-color="#22123a"/>
      <stop offset="1" stop-color="#3a1d3a"/>
    </linearGradient>
    <radialGradient id="moonGlow" r="50%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="bglow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fog" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="24"/></filter>
    <path id="banner" d="BANNER"/>
    <path id="bat" d="M0,0 q10,-14 22,-6 q4,-8 8,0 q4,-8 8,0 q12,-8 22,6 q-14,-2 -20,8 q-6,-6 -10,2 q-4,-8 -10,-2 q-6,-10 -20,-8 z"/>
    <style>
      .m { font-family: Menlo, Monaco, "SF Mono", monospace; white-space: pre; }
      .e { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <g fill="#e9e2ff" opacity="0.8">
    <circle cx="70" cy="40" r="1.8"/><circle cx="300" cy="26" r="1.4"/><circle cx="560" cy="40" r="1.8"/>
    <circle cx="30" cy="300" r="1.4"/><circle cx="1170" cy="320" r="1.8"/>
  </g>
  <circle cx="1110" cy="60" r="140" fill="url(#moonGlow)"/>
  <circle cx="1110" cy="60" r="40" fill="#f6efc8"/>
  <circle cx="1098" cy="50" r="7" fill="#e3d9a8"/><circle cx="1124" cy="74" r="9" fill="#e3d9a8"/>
  <g fill="#07040b"><use href="#bat" transform="translate(960,30) scale(0.9)"/></g>
  <g fill="#0a0710">
    <path d="M0,630 V575 Q300,550 600,565 T1200,555 V630 Z"/>
    <path d="M40,585 V525 A30,30 0 0 1 100,525 V585 Z"/>
    <path d="M1110,575 V522 h14 v-22 h12 v22 h14 v14 h-14 v39 h-12 v-39 h-14 Z"/>
  </g>
  <g filter="url(#fog)" fill="#c9b8e8" opacity="0.18"><ellipse cx="600" cy="590" rx="640" ry="30"/></g>

  <!-- banner: 77 units x 12 = 924 px, centred -->
  <g transform="translate(138,96) scale(12)">
    <use href="#banner" x="0.35" y="0.35" fill="#7a1010"/>
    <use href="#banner" fill="#ff8700" filter="url(#bglow)"/>
  </g>
  <g class="m" text-anchor="middle" font-weight="bold" font-size="44">
    <text x="600" y="262" fill="#ffffff">Agents are the callers.</text>
    <text x="600" y="320" fill="#ff8700">You are the Sysop.</text>
  </g>

  <g transform="translate(150,370)">
    <rect width="900" height="130" rx="18" fill="#030604" stroke="#2e2c38" stroke-width="4"/>
    <g class="m" font-size="28" fill="#c0c0c0">
      <text x="30" y="52"><tspan class="e">🔥</tspan> <tspan fill="#ff8700">running</tspan>  <tspan fill="#ffffff">#websites  Haunted landing page</tspan></text>
      <rect x="14" y="70" width="872" height="46" rx="6" fill="#ffff55" opacity="0.2"/>
      <text x="30" y="104"><tspan class="e">🔒</tspan> <tspan fill="#ffff55">blocked</tspan>  <tspan fill="#ffffff">#arcade</tspan>  <tspan fill="#ffff55" font-weight="bold">arcade-test spec</tspan></text>
      <text x="670" y="106" class="e" font-size="32">🧟</text>
      <text x="714" y="104" fill="#ffff55" font-weight="bold">needs you</text>
    </g>
    <rect width="900" height="130" rx="18" fill="url(#scan)"/>
  </g>
  <text x="600" y="555" class="m" text-anchor="middle" font-size="22" fill="#c8c0d8">Kiroween 2026 · Built with Kiro</text>
</svg>
